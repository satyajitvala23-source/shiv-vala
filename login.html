<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiv Computer - Login</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 20px 16px;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Dashboard matching sky blue gradient */
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #0369a1;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 18px;
            padding: 8px 16px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.08);
            transition: all 0.25s ease;
        }
        .back-link:hover {
            background: #ffffff;
            color: #0284c7;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.14);
        }

        .login-card {
            background-color: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 16px 40px rgba(12, 74, 110, 0.10);
            width: 100%;
            max-width: 440px;
            padding: 38px 34px;
            text-align: center;
            backdrop-filter: blur(14px);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #0284c7, #38bdf8, #0ea5e9);
        }

        .brand-badge-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .sc-logo-circle {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
        }

        .logo-header h1 {
            margin: 0;
            color: #0f172a;
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            letter-spacing: -0.02em;
        }

        .badge {
            background-color: #e0f2fe;
            color: #0284c7;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid #bae6fd;
            letter-spacing: 0;
        }

        .logo-header p {
            color: #64748b;
            font-size: 13px;
            margin-top: 6px;
            margin-bottom: 24px;
            line-height: 1.45;
        }

        /* Banner Message */
        .status-banner {
            display: none;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 20px;
            text-align: left;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .status-banner.error {
            display: flex;
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        .status-banner.success {
            display: flex;
            background-color: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
        .status-banner.loading {
            display: flex;
            background-color: #f0f9ff;
            color: #0369a1;
            border: 1px solid #bae6fd;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
            position: relative;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #334155;
            margin-bottom: 7px;
            font-weight: 600;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper i.prefix-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 14px;
            pointer-events: none;
            transition: color 0.2s;
        }
        .input-wrapper input {
            width: 100%;
            padding: 13px 15px 13px 40px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
            background-color: #f8fafc;
            font-family: inherit;
            color: #0f172a;
        }
        .input-wrapper input:focus {
            border-color: #0284c7;
            background-color: #ffffff;
            box-shadow: 0 0 0 3.5px rgba(2, 132, 199, 0.12);
        }
        .input-wrapper input:focus + i.prefix-icon,
        .input-wrapper input:focus ~ i.prefix-icon {
            color: #0284c7;
        }
        .eye-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: color 0.2s;
        }
        .eye-toggle:hover {
            color: #0284c7;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 13px;
            color: #475569;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            user-select: none;
            font-weight: 500;
        }
        .options input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #0284c7;
            cursor: pointer;
        }
        .options a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .options a:hover {
            color: #0369a1;
            text-decoration: underline;
        }

        .login-btn {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }
        .login-btn:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.38);
            transform: translateY(-1px);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none !important;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 22px 0 18px;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #e2e8f0;
        }
        .divider span {
            padding: 0 12px;
        }

        .secondary-btn {
            background: transparent;
            color: #0369a1;
            border: 1.5px solid #bae6fd;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }
        .secondary-btn:hover {
            background-color: #f0f9ff;
            border-color: #0284c7;
            color: #0284c7;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .footer-note i {
            color: #0284c7;
        }

        /* Mode toggling */
        .form-section {
            transition: opacity 0.2s ease;
        }
    </style>
</head>
<body>

    <a href="/index.html" class="back-link" title="Return to Shiv Computer Home">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to Home</span>
    </a>

    <div class="login-card">
        <div class="logo-header">
            <div class="brand-badge-row">
                <span class="sc-logo-circle">SC</span>
                <span class="badge">Online Portal</span>
            </div>
            <h1 id="viewTitle">Shiv Computer</h1>
            <p id="viewSubtitle">Digital Seva Kendra - Online Forms &amp; Government Services</p>
        </div>

        <!-- Dynamic Status / Alert Banner -->
        <div id="statusBanner" class="status-banner" role="alert">
            <i id="statusIcon" class="fa-solid fa-circle-info" style="margin-top: 2px;"></i>
            <span id="statusText"></span>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" class="form-section">
            <div class="input-group">
                <label for="username">User ID / Email</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="Enter your ID or Email" required autocomplete="username">
                    <i class="fa-regular fa-user prefix-icon"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    <i class="fa-solid fa-lock prefix-icon"></i>
                    <button type="button" class="eye-toggle" id="togglePassword" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="options">
                <label><input type="checkbox" id="rememberMe" checked> Remember me</label>
                <a href="#forgot" id="showForgotBtn">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span>Login to Dashboard</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <div class="divider"><span>OR</span></div>

            <button type="button" class="secondary-btn" id="showRegisterBtn">
                <i class="fa-solid fa-user-plus"></i>
                <span>Create New Account</span>
            </button>
        </form>

        <!-- REGISTRATION FORM -->
        <form id="registerForm" class="form-section" style="display: none;">
            <div class="input-group">
                <label for="regFullName">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="regFullName" placeholder="Enter your full name" required autocomplete="name">
                    <i class="fa-regular fa-id-card prefix-icon"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="regEmail">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="regEmail" placeholder="name@example.com" required autocomplete="email">
                    <i class="fa-regular fa-envelope prefix-icon"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="regMobile">Mobile Number</label>
                <div class="input-wrapper">
                    <input type="tel" id="regMobile" placeholder="10-digit mobile number" required autocomplete="tel">
                    <i class="fa-solid fa-phone prefix-icon"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="regPassword">Create Password</label>
                <div class="input-wrapper">
                    <input type="password" id="regPassword" placeholder="Minimum 6 characters" required autocomplete="new-password">
                    <i class="fa-solid fa-lock prefix-icon"></i>
                    <button type="button" class="eye-toggle" id="toggleRegPassword" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="regConfirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="regConfirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
                    <i class="fa-solid fa-shield-halved prefix-icon"></i>
                    <button type="button" class="eye-toggle" id="toggleRegConfirmPassword" aria-label="Toggle confirm password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn" id="registerBtn" style="margin-top: 10px;">
                <span>Create Account</span>
                <i class="fa-solid fa-user-check"></i>
            </button>

            <div class="divider"><span>OR</span></div>

            <button type="button" class="secondary-btn" id="backToLoginFromReg">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Already have an account? Sign In</span>
            </button>
        </form>

        <!-- FORGOT PASSWORD FORM -->
        <form id="forgotForm" class="form-section" style="display: none;">
            <p style="font-size: 13px; color: #475569; margin: 0 0 16px; line-height: 1.5; text-align: left;">
                Enter your registered email address or username. We will send you an official Firebase password reset link.
            </p>

            <div class="input-group">
                <label for="forgotEmail">Registered Email or Username</label>
                <div class="input-wrapper">
                    <input type="text" id="forgotEmail" placeholder="Enter your email or username" required autocomplete="email">
                    <i class="fa-regular fa-envelope prefix-icon"></i>
                </div>
            </div>

            <button type="submit" class="login-btn" id="forgotBtn" style="margin-top: 10px;">
                <span>Send Reset Link</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>

            <div class="divider"><span>OR</span></div>

            <button type="button" class="secondary-btn" id="backToLoginFromForgot">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Login</span>
            </button>
        </form>

        <div class="footer-note">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Secure Firebase Authentication &bull; Official Portal</span>
        </div>
    </div>

    <!-- Firebase Authentication & Routing Logic -->
    <script type="module">
        import { auth, db } from './src/firebase';
        import {
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            sendPasswordResetEmail,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence,
            updateProfile,
            signOut
        } from 'firebase/auth';
        import { doc, getDoc, setDoc, serverTimestamp } from 'firebase/firestore';
        import { cleanUsername, formatAuthError } from './src/lib/auth';
        import { isUidAuthorizedAdmin } from './src/lib/firestore';

        // Elements
        const viewTitle = document.getElementById('viewTitle');
        const viewSubtitle = document.getElementById('viewSubtitle');
        const statusBanner = document.getElementById('statusBanner');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');

        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const forgotForm = document.getElementById('forgotForm');

        const showForgotBtn = document.getElementById('showForgotBtn');
        const showRegisterBtn = document.getElementById('showRegisterBtn');
        const backToLoginFromReg = document.getElementById('backToLoginFromReg');
        const backToLoginFromForgot = document.getElementById('backToLoginFromForgot');

        // Eye Toggles
        function bindEyeToggle(btnId, inputId) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            if (!btn || !input) return;
            btn.addEventListener('click', () => {
                const isPass = input.type === 'password';
                input.type = isPass ? 'text' : 'password';
                const icon = btn.querySelector('i');
                if (icon) {
                    icon.className = isPass ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
                }
            });
        }
        bindEyeToggle('togglePassword', 'password');
        bindEyeToggle('toggleRegPassword', 'regPassword');
        bindEyeToggle('toggleRegConfirmPassword', 'regConfirmPassword');

        // Status Banner Handler
        function showStatus(type, message) {
            if (!statusBanner || !statusIcon || !statusText) return;
            statusBanner.className = `status-banner ${type}`;
            statusText.textContent = message;

            if (type === 'error') {
                statusIcon.className = 'fa-solid fa-triangle-exclamation';
            } else if (type === 'success') {
                statusIcon.className = 'fa-solid fa-circle-check';
            } else if (type === 'loading') {
                statusIcon.className = 'fa-solid fa-circle-notch fa-spin';
            } else {
                statusIcon.className = 'fa-solid fa-circle-info';
            }
        }

        function clearStatus() {
            if (statusBanner) {
                statusBanner.className = 'status-banner';
                statusBanner.style.display = 'none';
            }
        }

        // Mode Switching
        function setView(mode) {
            clearStatus();
            if (mode === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                forgotForm.style.display = 'none';
                viewTitle.textContent = 'Shiv Computer';
                viewSubtitle.textContent = 'Digital Seva Kendra - Online Forms & Government Services';
            } else if (mode === 'register') {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                forgotForm.style.display = 'none';
                viewTitle.textContent = 'Create Citizen Account';
                viewSubtitle.textContent = 'Register to apply and track online government schemes';
            } else if (mode === 'forgot') {
                loginForm.style.display = 'none';
                registerForm.style.display = 'none';
                forgotForm.style.display = 'block';
                viewTitle.textContent = 'Reset Password';
                viewSubtitle.textContent = 'Receive a secure password reset link to your email';
            }
        }

        if (showForgotBtn) {
            showForgotBtn.addEventListener('click', (e) => {
                e.preventDefault();
                setView('forgot');
                const usernameInput = document.getElementById('username');
                const forgotInput = document.getElementById('forgotEmail');
                if (usernameInput && forgotInput && usernameInput.value.trim()) {
                    forgotInput.value = usernameInput.value.trim();
                }
            });
        }
        if (showRegisterBtn) showRegisterBtn.addEventListener('click', () => setView('register'));
        if (backToLoginFromReg) backToLoginFromReg.addEventListener('click', () => setView('login'));
        if (backToLoginFromForgot) backToLoginFromForgot.addEventListener('click', () => setView('login'));

        // Resolve Email from Username or Email
        async function resolveEmail(identifier) {
            const trimmed = identifier.trim().toLowerCase();
            if (trimmed.includes('@')) return trimmed;
            const normalized = cleanUsername(trimmed);
            try {
                const snap = await getDoc(doc(db, 'usernames', normalized));
                if (snap.exists() && snap.data()?.email) {
                    return snap.data().email.toLowerCase();
                }
            } catch (err) {
                console.warn('[Resolve Email] Username lookup notice:', err);
            }
            if (normalized === 'admin' || normalized === 'satu') {
                return 'satyajitvala23@gmail.com';
            }
            return trimmed;
        }

        // 1. LOGIN SUBMIT
        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const usernameInput = document.getElementById('username');
                const passwordInput = document.getElementById('password');
                const rememberMeInput = document.getElementById('rememberMe');
                const submitBtn = document.getElementById('loginBtn');

                const identifier = usernameInput ? usernameInput.value.trim() : '';
                const password = passwordInput ? passwordInput.value.trim() : '';
                const rememberMe = rememberMeInput ? rememberMeInput.checked : true;

                if (!identifier || !password) {
                    showStatus('error', 'Please enter your username/email and password.');
                    return;
                }

                try {
                    showStatus('loading', 'Authenticating with Firebase...');
                    if (submitBtn) submitBtn.disabled = true;

                    try {
                        await setPersistence(auth, rememberMe ? browserLocalPersistence : browserSessionPersistence);
                    } catch (pErr) {
                        console.warn('[Login] Persistence notice:', pErr);
                    }

                    const email = await resolveEmail(identifier);
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // Fetch user document from Firestore to check role and status
                    let userRole = 'user';
                    let userStatus = 'Active';
                    let userName = user.displayName || 'User';

                    try {
                        const userDocRef = doc(db, 'users', user.uid);
                        const userSnap = await getDoc(userDocRef);
                        if (userSnap.exists()) {
                            const data = userSnap.data();
                            if (data.role === 'admin') userRole = 'admin';
                            if (data.status) userStatus = data.status;
                            if (data.name) userName = data.name;
                        }
                    } catch (fsErr) {
                        console.warn('[Login] Firestore profile notice:', fsErr);
                    }

                    // Check if authorized admin
                    const isConfirmedAdmin = (await isUidAuthorizedAdmin(user.uid)) || userRole === 'admin';
                    if (isConfirmedAdmin) {
                        userRole = 'admin';
                    }

                    if (userStatus.toLowerCase() === 'inactive') {
                        await signOut(auth);
                        showStatus('error', 'Your account has been deactivated. Please contact Shiv Computer.');
                        if (submitBtn) submitBtn.disabled = false;
                        return;
                    }

                    if (userRole === 'admin') {
                        showStatus('success', `Welcome Administrator! Redirecting to Admin Dashboard...`);
                        sessionStorage.setItem('sc_current_role', 'admin');
                        setTimeout(() => {
                            window.location.href = '/admin-dashboard.html';
                        }, 800);
                    } else {
                        showStatus('success', `Welcome back, ${userName}! Redirecting to Dashboard...`);
                        sessionStorage.setItem('sc_current_role', 'user');
                        setTimeout(() => {
                            window.location.href = '/user-dashboard.html';
                        }, 800);
                    }

                } catch (err) {
                    console.error('[Login Error]', err);
                    showStatus('error', formatAuthError(err));
                } finally {
                    if (submitBtn) submitBtn.disabled = false;
                }
            });
        }

        // 2. REGISTER SUBMIT
        if (registerForm) {
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const nameInput = document.getElementById('regFullName');
                const emailInput = document.getElementById('regEmail');
                const mobileInput = document.getElementById('regMobile');
                const passwordInput = document.getElementById('regPassword');
                const confirmPasswordInput = document.getElementById('regConfirmPassword');
                const submitBtn = document.getElementById('registerBtn');

                const fullName = nameInput ? nameInput.value.trim() : '';
                const email = emailInput ? emailInput.value.trim().toLowerCase() : '';
                const mobile = mobileInput ? mobileInput.value.trim() : '';
                const password = passwordInput ? passwordInput.value.trim() : '';
                const confirmPassword = confirmPasswordInput ? confirmPasswordInput.value.trim() : '';

                if (!fullName || !email || !mobile || !password) {
                    showStatus('error', 'Please fill in all registration fields.');
                    return;
                }

                if (password.length < 6) {
                    showStatus('error', 'Password must be at least 6 characters long.');
                    return;
                }

                if (password !== confirmPassword) {
                    showStatus('error', 'Passwords do not match. Please re-enter.');
                    return;
                }

                const cleanPhone = mobile.replace(/[^0-9]/g, '');
                if (cleanPhone.length < 10) {
                    showStatus('error', 'Please provide a valid 10-digit mobile number.');
                    return;
                }

                try {
                    showStatus('loading', 'Creating your citizen account...');
                    if (submitBtn) submitBtn.disabled = true;

                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    try {
                        await updateProfile(user, { displayName: fullName });
                    } catch (pErr) {
                        console.warn('[Register] Display name update notice:', pErr);
                    }

                    // Save user profile in Firestore
                    const userDoc = {
                        uid: user.uid,
                        name: fullName,
                        email: email,
                        phone: mobile,
                        mobile: mobile,
                        role: 'user',
                        status: 'active',
                        joinedDate: new Date().toISOString().split('T')[0],
                        createdAt: serverTimestamp(),
                    };

                    await setDoc(doc(db, 'users', user.uid), userDoc, { merge: true });

                    showStatus('success', 'Account created successfully! Redirecting to User Dashboard...');
                    sessionStorage.setItem('sc_current_role', 'user');
                    setTimeout(() => {
                        window.location.href = '/user-dashboard.html';
                    }, 1200);

                } catch (err) {
                    console.error('[Register Error]', err);
                    showStatus('error', formatAuthError(err));
                } finally {
                    if (submitBtn) submitBtn.disabled = false;
                }
            });
        }

        // 3. FORGOT PASSWORD SUBMIT
        if (forgotForm) {
            forgotForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const forgotInput = document.getElementById('forgotEmail');
                const submitBtn = document.getElementById('forgotBtn');
                const rawVal = forgotInput ? forgotInput.value.trim() : '';

                if (!rawVal) {
                    showStatus('error', 'Please enter your registered email or username.');
                    return;
                }

                try {
                    showStatus('loading', 'Resolving account and sending reset link...');
                    if (submitBtn) submitBtn.disabled = true;

                    const email = await resolveEmail(rawVal);
                    if (!email || !email.includes('@')) {
                        showStatus('error', 'Could not locate an email address for this username.');
                        if (submitBtn) submitBtn.disabled = false;
                        return;
                    }

                    await sendPasswordResetEmail(auth, email);
                    showStatus('success', `Reset link sent to ${email}! Please check your inbox or spam folder.`);
                    setTimeout(() => {
                        setView('login');
                    }, 3500);

                } catch (err) {
                    console.error('[Forgot Password Error]', err);
                    showStatus('error', formatAuthError(err));
                } finally {
                    if (submitBtn) submitBtn.disabled = false;
                }
            });
        }
    </script>
</body>
</html>
